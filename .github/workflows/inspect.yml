name: 巡检

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect.yml'
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  inspect:
    name: 巡检构建状态
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 等待构建跑到卡点
        run: sleep 300

      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const nl = String.fromCharCode(10);
            const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, per_page: 6 });
            let out = [];
            for (const r of runs.data.workflow_runs) {
              out.push('RUN #' + r.run_number + ' | ' + r.name + ' | status=' + r.status + ' | conclusion=' + r.conclusion);
              const jobs = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: r.id });
              for (const j of jobs.data.jobs) {
                out.push('  JOB ' + j.name + ' | status=' + j.status + ' | conclusion=' + j.conclusion);
                for (const s of (j.steps || [])) {
                  out.push('    ' + s.number + '. ' + s.name + ' => ' + s.conclusion + ' (' + s.status + ')');
                }
              }
            }
            let body = out.join(nl);
            if (body.length > 29000) body = body.slice(-29000);
            await github.rest.issues.create({
              owner, repo,
              title: '【巡检】#' + context.runNumber,
              body: '```' + nl + body + nl + '```'
            });
