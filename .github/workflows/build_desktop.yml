# 云端 Windows 打包桌面 exe（本机沙箱 Python 缺 Tcl/Tk 运行时，故在 windows runner 用完整 Python 打包）
name: 构建桌面版EXE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_desktop.yml'
      - 'desktop/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Windows 打包桌面 exe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 验证 Tcl/Tk 可用
        run: python -c "import tkinter; print('tk ok')"

      - name: PyInstaller 打包
        run: |
          cd desktop
          python -m PyInstaller --onefile --windowed --noconfirm --name liuyao-desktop liuyao_app.pyw

      - name: 冒烟测试（启动 exe 后关闭）
        shell: pwsh
        run: |
          $exe = "desktop\dist\liuyao-desktop.exe"
          if (!(Test-Path $exe)) { Write-Error "exe not found"; exit 1 }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { Write-Error "exe exited early code=$($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Output "smoke ok"

      - name: 发布 Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const exe = fs.readFileSync('desktop/dist/liuyao-desktop.exe');
            const owner = context.repo.owner, repo = context.repo.repo;
            const r = await github.rest.repos.getReleaseByTag({owner, repo, tag: 'latest'});
            const release = r.data;
            const existing = await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id});
            for (const a of existing.data) {
              if (a.name === 'liuyao-desktop.exe') {
                await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: a.id});
              }
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id,
              name: 'liuyao-desktop.exe', data: exe,
              headers: { 'content-type': 'application/x-msdownload' }
            });
            await github.rest.issues.create({owner, repo,
              title:'桌面版 EXE 构建并发布成功',
              body:'时间=' + new Date().toISOString()});
