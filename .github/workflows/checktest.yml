name: checkout测试

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/checktest.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  t:
    name: checkout 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 列出文件
        run: ls -la
      - name: 查看预装环境（对照 build 步骤2）
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - name: 上报成功
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'checkout测试成功（含预装环境）',
              body: 'checkout + java -version + SDK 检查正常，时间=' + new Date().toISOString()
            });
