name: 部署手机网页

on:
  workflow_dispatch:

# 自动触发暂时停用：当前 Actions 环境间歇卡顿。在线固定网址后续可在
# 仓库 Settings→Pages 选 “GitHub Actions” 后，再手动运行本 workflow。
# 手机网页分享目前请直接用单文件「六爻预测.html」（微信/QQ 发送即可）。
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  setup:
    name: 启用 Pages 站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 启用（报告结果）
        uses: actions/github-script@v7
        with:
          script: |
            let msg;
            try {
              const r = await github.rest.repos.createPagesSite({
                owner: context.repo.owner, repo: context.repo.repo, build_type: 'workflow'
              });
              msg = 'createPagesSite 成功：' + JSON.stringify(r.data);
            } catch (e1) {
              try {
                const g = await github.rest.repos.getPages({
                  owner: context.repo.owner, repo: context.repo.repo
                });
                msg = '站点已存在：' + JSON.stringify(g.data);
              } catch (e2) {
                msg = 'create 失败: ' + e1.message + ' | get 失败: ' + e2.message;
              }
            }
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,
              title:'【网页】Pages 状态',body:msg});

  deploy:
    name: 部署
    needs: setup
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 组装站点
        run: |
          set -e
          mkdir -p public
          cp index.html app.js liuyao_core.js liuyao_zhuan.js manifest.json sw.js public/
          cp -r icons public/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        name: 部署
        uses: actions/deploy-pages@v4

      - name: 上报网址
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,
              title:'【网页】部署成功',
              body:'网址：' + 'https://' + context.repo.owner + '.github.io/' + context.repo.repo + '/'});
