name: 构建APK与发布网页

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apk:
    name: 构建安卓 APK
    runs-on: ubuntu-latest
    outputs:
      apkfile: ${{ steps.rename.outputs.apkfile }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 安装固定 Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d $HOME
          echo "$HOME/gradle-8.9/bin" >> $GITHUB_PATH

      - name: 准备网页资源到 assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp index.html app.js liuyao_core.js liuyao_zhuan.js manifest.json sw.js \
             android/app/src/main/assets/web/
          cp -r icons android/app/src/main/assets/web/

      - name: 构建 Release APK
        run: gradle -p android assembleRelease --no-daemon 2>&1 | tee build_log.txt

      - name: 失败时上报构建日志
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build_log.txt', 'utf8'); } catch (e) { log = '无日志 ' + e; }
            log = log.slice(-29000);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '【构建日志】#' + context.runNumber,
              body: '```
' + log + '
```'
            });

      - name: 规范 APK 文件名
        id: rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk 六爻预测.apk
          echo "apkfile=六爻预测.apk" >> $GITHUB_OUTPUT

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 六爻预测-APK
          path: 六爻预测.apk
          retention-days: 90

  publish-release:
    name: 发布 APK 到 Release
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: 六爻预测-APK

      - name: 发布到 latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag: latest
          name: 六爻预测（最新版）
          body: |
            安卓手机安装包，下载后点开即可安装，无需联网。
            若提示“未知来源”，允许本次安装即可。
          files: 六爻预测.apk
          prerelease: false

  deploy-pages:
    name: 发布手机网页
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 组装站点文件
        run: |
          mkdir -p public
          cp index.html app.js liuyao_core.js liuyao_zhuan.js manifest.json sw.js public/
          cp -r icons public/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
