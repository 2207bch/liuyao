name: 构建APK与发布网页

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apk:
    name: 构建安卓 APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    outputs:
      apkfile: ${{ steps.rename.outputs.apkfile }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK（使用镜像预装）
        run: |
          {
            yes | sdkmanager --licenses
            sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          } 2>&1 | tee sdk_log.txt

      - name: 安装固定 Gradle 8.9
        run: |
          {
            wget --tries=3 --timeout=60 https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -o gradle-8.9-bin.zip -d $HOME
            echo "$HOME/gradle-8.9/bin" >> $GITHUB_PATH
            $HOME/gradle-8.9/bin/gradle --version
          } 2>&1 | tee gradle_install_log.txt

      - name: 准备网页资源到 assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp index.html app.js liuyao_core.js liuyao_zhuan.js manifest.json sw.js \
             android/app/src/main/assets/web/
          cp -r icons android/app/src/main/assets/web/

      - name: 构建 Release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt

      - name: 失败时上报诊断
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const nl = String.fromCharCode(10);
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            let report = [];
            let failLines = [];
            for (let i = 0; i < 15; i++) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
              });
              report = [];
              failLines = [];
              for (const job of jobs.data.jobs) {
                for (const step of (job.steps || [])) {
                  const line = step.number + '. ' + step.name + ' => ' + step.conclusion;
                  report.push(line);
                  if (step.conclusion === 'failure') failLines.push(line);
                }
              }
              if (failLines.length > 0) break;
              await sleep(4000);
            }
            const readLog = (name) => {
              try {
                let t = fs.readFileSync(name, 'utf8');
                if (t.length > 9000) t = t.slice(-9000);
                return t;
              } catch (e) { return '（无 ' + name + '）'; }
            };
            const body = '【失败步骤】' + nl + failLines.join(nl) + nl + nl +
                         '【全部步骤】' + nl + report.join(nl) + nl + nl +
                         '【SDK 日志】' + nl + '```' + nl + readLog('sdk_log.txt') + nl + '```' + nl +
                         '【Gradle 安装日志】' + nl + '```' + nl + readLog('gradle_install_log.txt') + nl + '```' + nl +
                         '【构建日志】' + nl + '```' + nl + readLog('build_log.txt') + nl + '```';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '【构建诊断】#' + context.runNumber,
              body: body
            });

      - name: 规范 APK 文件名
        id: rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk 六爻预测.apk
          echo "apkfile=六爻预测.apk" >> $GITHUB_OUTPUT

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 六爻预测-APK
          path: 六爻预测.apk
          retention-days: 90

  publish-release:
    name: 发布 APK 到 Release
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: 六爻预测-APK

      - name: 发布到 latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag: latest
          name: 六爻预测（最新版）
          body: |
            安卓手机安装包，下载后点开即可安装，无需联网。
            若提示“未知来源”，允许本次安装即可。
          files: 六爻预测.apk
          prerelease: false

  deploy-pages:
    name: 发布手机网页
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 组装站点文件
        run: |
          mkdir -p public
          cp index.html app.js liuyao_core.js liuyao_zhuan.js manifest.json sw.js public/
          cp -r icons public/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
