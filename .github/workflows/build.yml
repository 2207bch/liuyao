name: 构建APK与发布网页

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apk:
    name: 构建安卓 APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 查看预装 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: 手工构建 APK（不用 Gradle，零 Maven 下载）
        run: bash android/build_manual.sh 2>&1 | tee build_log.txt

      - name: 失败时上报诊断
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const nl = String.fromCharCode(10);
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            let report = [];
            let failLines = [];
            for (let i = 0; i < 12; i++) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
              });
              report = [];
              failLines = [];
              for (const job of jobs.data.jobs) {
                for (const step of (job.steps || [])) {
                  const line = step.number + '. ' + step.name + ' => ' + step.conclusion;
                  report.push(line);
                  if (step.conclusion === 'failure') failLines.push(line);
                }
              }
              if (failLines.length > 0) break;
              await sleep(4000);
            }
            let log = '';
            try {
              log = fs.readFileSync('build_log.txt', 'utf8');
              if (log.length > 22000) log = log.slice(-22000);
            } catch (e) { log = '（无构建日志）'; }
            const body = '【失败步骤】' + nl + failLines.join(nl) + nl + nl +
                         '【全部步骤】' + report.join(nl) + nl + nl +
                         '【构建日志】' + nl + '```' + nl + log + nl + '```';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '【构建诊断】#' + context.runNumber,
              body: body
            });

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 六爻预测-APK
          path: 六爻预测.apk
          retention-days: 90

  publish-release:
    name: 发布 APK 到 Release
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: 六爻预测-APK

      - name: 发布到 latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag: latest
          name: 六爻预测（最新版）
          body: |
            安卓手机安装包，下载后点开即可安装，无需联网。
            若提示“未知来源”，允许本次安装即可。
          files: 六爻预测.apk
          prerelease: false

  deploy-pages:
    name: 发布手机网页
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 组装站点文件
        run: |
          mkdir -p public
          cp index.html app.js liuyao_core.js liuyao_zhuan.js manifest.json sw.js public/
          cp -r icons public/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
