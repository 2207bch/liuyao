plugins {
    id 'com.android.application'
}

android {
    namespace 'com.liuyao.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.liuyao.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 debug 签名，使生成的 release APK 可直接安装分享
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
